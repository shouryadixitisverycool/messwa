<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment reader eval</title>
<style>
:root {
  --bg: #f6f6f4; --card: #fff; --text: #1b1b1b; --muted: #6b6b6b; --line: #e2e2de; --soft: #f0f0ec;
  --accent: #2f6fdf; --ok: #1d7a46; --ok-bg: #e5f4ea; --bad: #b3261e; --bad-bg: #fbe7e5; --warn: #8a5a00; --warn-bg: #fbf0d9;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121212; --card: #1d1d1d; --text: #ececec; --muted: #9a9a9a; --line: #2e2e2e; --soft: #262626;
    --accent: #7aa7ff; --ok: #6fd49a; --ok-bg: #173323; --bad: #ff8a80; --bad-bg: #3a1a18; --warn: #f0c060; --warn-bg: #3a2e12; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
a { color: var(--accent); }
h1 { font-size: 20px; margin: 0 0 4px; }
p.sub { color: var(--muted); margin: 0 0 18px; }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
.filters button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
.filters button[aria-pressed=true] { background: var(--text); color: var(--bg); border-color: var(--text); }
.case { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; display: grid; grid-template-columns: 220px 1fr; gap: 18px; }
@media (max-width: 680px) { .case { grid-template-columns: 1fr; } .case .shot { max-width: 240px; } }
.shot img { width: 100%; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; display: block; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; margin-bottom: 6px; }
.head h2 { font-size: 17px; margin: 0; }
.head .meta { color: var(--muted); font-size: 13px; }
.note { margin: 0 0 12px; font-size: 14px; }
.decision { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; margin-bottom: 12px; padding: 10px 12px; border-radius: 8px; background: var(--soft); }
.decision dt { color: var(--muted); } .decision dd { margin: 0; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 4px 8px; border-bottom: 1px solid var(--line); }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
td:first-child { color: var(--muted); white-space: nowrap; overflow-wrap: normal; }
td.v { width: 28px; text-align: center; font-weight: 700; }
tr.ok td.v { color: var(--ok); } tr.bad td.v { color: var(--bad); } tr.bad td.read { background: var(--bad-bg); }
.empty { color: var(--muted); }
.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; font-weight: 500; }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
.foot { color: var(--muted); font-size: 12px; margin-top: 8px; }
dialog { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 96vh; }
dialog img { max-width: 96vw; max-height: 92vh; border-radius: 8px; display: block; }
dialog::backdrop { background: rgb(0 0 0 / .8); }
</style>
</head>
<body>
<main>
  <h1>Payment reader eval</h1>
  <p class="sub">Every image a buyer sent within 30 minutes of a pay prompt in your sell chats, Nov 12 to 25. Each one shows what Gemini read next to the values I checked by hand. <a href="./">Upload page</a></p>
  <div class="summary" id="summary"></div>
  <div class="filters" id="filters"></div>
  <div id="cases"></div>
</main>
<dialog id="zoom"><img alt=""></dialog>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const paise = a => { if (!a) return null; const m = String(a).replace(/[₹,\s]/g, "").match(/^(\d+)(?:\.(\d{1,2}))?$/); return m ? +m[1] * 100 + +((m[2] || "0").padEnd(2, "0")) : NaN; };
const rupees = p => p == null ? "" : "₹" + (p % 100 ? (p / 100).toFixed(2) : p / 100);
const upiNorm = s => String(s || "").toLowerCase().replace(/^[•x*\s]+/, "");
const noUPI = s => /\(.*no upi/i.test(s || "");
const when = at => new Date(at + "Z").toLocaleString("en-IN", { timeZone: "Asia/Kolkata", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
const secs = t => parseFloat(t) * (t.endsWith("ms") ? 0.001 : t.endsWith("m") && !t.endsWith("ms") ? 60 : 1);

// What the bot should do, from the hand-checked values, and what it would
// do from the read (the payee check as built now: your UPI ID only).
function correctAction(c) {
  const t = c.truth;
  if (!t.is_payment_receipt) return { text: "Reject: not a payment", kind: "bad" };
  if (c.agreed == null) return { text: `Count ${rupees(paise(t.amount))} toward the earlier payment`, kind: "ok" };
  const p = paise(t.amount), want = c.agreed * 100;
  if (p < want) return { text: `Ask for ${rupees(want - p)} more`, kind: "warn" };
  return { text: "Send the meal QR", kind: "ok" };
}
function readerAction(c) {
  const r = c.read;
  if (!r.is_payment_receipt) return { text: "Reject: not a payment", kind: "bad" };
  if (r.status !== "success") return { text: `Hold: status ${r.status}`, kind: "warn" };
  if (!r.payee_matches) return { text: "Hold for you: payee doesn't match your UPI ID", kind: "warn" };
  if (c.agreed == null) return { text: `Count ${rupees(r.amount_paise)} toward the earlier payment`, kind: "ok" };
  if (r.amount_paise < c.agreed * 100) return { text: `Ask for ${rupees(c.agreed * 100 - r.amount_paise)} more`, kind: "warn" };
  return { text: "Send the meal QR", kind: "ok" };
}

function rows(c) {
  const t = c.truth, r = c.read, out = [];
  out.push(["Payment receipt", t.is_payment_receipt ? "yes" : "no", r.is_payment_receipt ? "yes" : "no", t.is_payment_receipt === r.is_payment_receipt]);
  if (!t.is_payment_receipt && !r.is_payment_receipt) return out;
  out.push(["Status", t.status, r.status, t.status === r.status]);
  out.push(["Amount", rupees(paise(t.amount)), r.amount ? rupees(r.amount_paise) : "", paise(t.amount) === r.amount_paise]);
  const payeeOK = noUPI(t.payee) ? !r.payee_upi : upiNorm(t.payee) === upiNorm(r.payee_upi);
  out.push(["Payee UPI ID", t.payee, r.payee_upi, payeeOK]);
  out.push(["UTR", t.utr, r.utr, (t.utr || "") === (r.utr || "")]);
  return out;
}

let data = [], filter = "all";
const FILTERS = [["all", "All"], ["payments", "Payments"], ["other", "Not payments"], ["misreads", "Any misread"], ["differs", "Wrong action"]];
function matches(c) {
  const bad = rows(c).some(r => !r[3]);
  const diff = correctAction(c).text !== readerAction(c).text;
  return filter === "all" || (filter === "payments" && c.truth.is_payment_receipt) || (filter === "other" && !c.truth.is_payment_receipt)
    || (filter === "misreads" && bad) || (filter === "differs" && diff);
}

function render() {
  $("#filters").innerHTML = FILTERS.map(([k, l]) => `<button data-f="${k}" aria-pressed="${k === filter}">${l} (${data.filter(c => { const f = filter; filter = k; const m = matches(c); filter = f; return m; }).length})</button>`).join("");
  $("#cases").innerHTML = data.filter(matches).map(c => {
    const ca = correctAction(c), ra = readerAction(c), same = ca.text === ra.text;
    return `<article class="case">
      <div class="shot"><img src="eval/img/${esc(c.image)}" alt="Screenshot ${c.id}" loading="lazy"></div>
      <div>
        <div class="head"><h2>#${c.id}${c.app ? " · " + esc(c.app) : ""}</h2>
          <span class="meta">${esc(when(c.at))}${c.agreed != null ? " · agreed ₹" + c.agreed : ""}</span>
          <span class="pill ${same ? "ok" : "bad"}">${same ? "right action" : "wrong action"}</span></div>
        <p class="note">${esc(c.note)}</p>
        <dl class="decision"><dt>Should</dt><dd><span class="pill ${ca.kind}">${esc(ca.text)}</span></dd>
          <dt>Reader would</dt><dd><span class="pill ${ra.kind}">${esc(ra.text)}</span></dd></dl>
        <table><thead><tr><th>Field</th><th>Correct</th><th>Gemini read</th><th></th></tr></thead><tbody>
        ${rows(c).map(([f, t, r, ok]) => `<tr class="${ok ? "ok" : "bad"}"><td>${f}</td><td>${esc(t) || '<span class="empty">none</span>'}</td><td class="read">${esc(r) || '<span class="empty">none</span>'}</td><td class="v">${ok ? "✓" : "✗"}</td></tr>`).join("")}
        </tbody></table>
        <div class="foot">${esc(c.read.model)} · ${esc(c.read.took)}${c.read.payee_matches === undefined ? "" : " · payee check " + (c.read.payee_matches ? "passed" : "failed")}</div>
      </div></article>`;
  }).join("") || `<p class="empty">Nothing matches.</p>`;
}

function summary() {
  const pays = data.filter(c => c.truth.is_payment_receipt), other = data.filter(c => !c.truth.is_payment_receipt);
  const amt = pays.filter(c => paise(c.truth.amount) === c.read.amount_paise).length;
  const rej = other.filter(c => !c.read.is_payment_receipt).length;
  const payee = pays.filter(c => c.read.payee_matches).length;
  const printed = pays.filter(c => c.truth.utr), utr = printed.filter(c => c.read.utr === c.truth.utr).length;
  const act = data.filter(c => correctAction(c).text === readerAction(c).text).length;
  const times = data.map(c => secs(c.read.took)).sort((a, b) => a - b), med = times[Math.floor(times.length / 2)];
  const stat = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  $("#summary").innerHTML = stat(`${amt}/${pays.length}`, "amounts read correctly") + stat(`${rej}/${other.length}`, "non-payments rejected")
    + stat(`${payee}/${pays.length}`, "pass the payee check") + stat(`${utr}/${printed.length}`, "printed UTRs read")
    + stat(`${act}/${data.length}`, "right action") + stat(`${med.toFixed(1)}s`, `median read (${times[0].toFixed(1)} to ${times.at(-1).toFixed(0)}s)`);
}

fetch("eval/data").then(r => r.json()).then(d => { data = d; summary(); render(); })
  .catch(e => { $("#cases").innerHTML = `<p class="empty">Couldn't load the eval set: ${esc(e)}</p>`; });
$("#filters").addEventListener("click", e => { const f = e.target.dataset.f; if (f) { filter = f; render(); } });
$("#cases").addEventListener("click", e => { if (e.target.matches(".shot img")) { $("#zoom img").src = e.target.src; $("#zoom").showModal(); } });
$("#zoom").addEventListener("click", () => $("#zoom").close());
</script>
</body>
</html>
