<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d12">
<title>Mess Auction House</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="silkscreen-700.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="sale.css">
<script src="common.js" defer></script>
<script src="sale.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo" id="logo"></span>
      <div>
        <h1>Mess Auction House</h1>
        <p class="sub" id="sub">Buy it now</p>
      </div>
      <nav class="navs" aria-label="Pages">
        <a class="nav-link" href="sales.html" id="salesLink" title="Who you sold to, and for how much"><span id="navIcon"></span><b id="salesLabel">My sales</b></a>
        <a class="nav-link" href="insights.html" id="insLink" title="What sells, when, and who's selling" hidden><span id="insIcon"></span>Insights</a>
        <a class="nav-link" href="usage.html" id="useLink" title="How everyone is using messwa" hidden><span id="useIcon"></span>Usage</a>
        <a class="nav-link" href="settings.html" id="settingsBtn" title="Settings"><span id="settingsIcon"></span>Settings</a>
        <a class="nav-link" href="account.html" id="accountLink" title="Your account">Account</a>
      </nav>
    </div>
    <div class="day" id="day">
      <div class="day-label" id="dayLabel">&nbsp;</div>
      <div class="track" id="track"></div>
    </div>
    <label class="search">
      <span class="search-key" aria-hidden="true">/</span>
      <input id="q" type="search" placeholder="Search seller, number, text" autocomplete="off" spellcheck="false">
    </label>
  </header>

  <a class="setup-warn" id="noGroups" href="settings.html#offer" hidden><b>Your offers have nowhere to go.</b> Pick the WhatsApp groups to post in before you sell. <span class="go">Pick groups &rsaquo;</span></a>

  <div class="sales-box" id="sales" hidden></div>

  <main class="chest" id="chest">
    <div class="chest-head">
      <span class="head-icon" id="headIcon"></span>
      <span class="head-name" id="headName">Loading</span>
      <span class="head-meta" id="headMeta"></span>
      <span class="pager" id="pager">
        <button class="pg" id="pgPrev" aria-label="Previous page">&lsaquo;</button>
        <span id="pgText"></span>
        <button class="pg" id="pgNext" aria-label="Next page">&rsaquo;</button>
      </span>
      <span class="live" id="live"><i></i><span id="liveText">connecting</span></span>
    </div>
    <div class="body">
      <nav class="tabs" id="tabs" aria-label="Messes"></nav>
      <section class="grid" id="grid" aria-label="Listings"></section>
    </div>
    <div class="controls">
      <div class="ctl-left" id="ctlLeft"></div>
      <div class="ctl-row" id="ctlRow"></div>
    </div>
  </main>

  <section class="chest pulse" id="pulse" aria-label="Market stats">
    <div class="chest-head">
      <span class="head-icon" id="pulseIcon"></span>
      <span class="head-name">Market pulse</span>
      <span class="head-meta" id="pulseMeta"></span>
      <span class="legend" aria-hidden="true"><span><i class="m"></i>messages</span><span><i></i>sales</span></span>
      <span class="wins" id="wins" role="group" aria-label="Stats window"></span>
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <footer class="hint" id="hint">
    <span><kbd>1</kbd>-<kbd>5</kbd> messes</span>
    <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> pages</span>
    <span><kbd>R</kbd> recent</span>
    <span><kbd>P</kbd> price</span>
    <span><kbd>D</kbd> diet</span>
    <span><kbd>M</kbd> meal</span>
    <span><kbd>S</kbd> sold</span>
    <span><kbd>W</kbd> wanted</span>
    <span><kbd>/</kbd> search</span>
  </footer>
</div>

<div class="tip" id="tip" hidden></div>
<div class="modal" id="modal" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" hidden></div>
</body>
</html>
