# Every messwa user links their own WhatsApp on /account.html.
# Only the market board is shared. Private data and selling settings are
# stored in that user's database under state/user-ID/.
# On upgrade the existing admin keeps state/session.db and state/messwa.db.
# [sell], [sales] and mcp.sell_tasks below are fallbacks for that migrated
# admin. Other users edit their own conservative defaults on /account.html.
# Phone identity comes from each linked device; no shared UPI address is used.
# Copy to config.toml. Everything except `groups` has a working default.
# Admins can change most of these on the dashboard's settings page, which
# stores its values in the database on top of this file. See "Settings page"
# in the README.

state_dir = "state"
timezone = "Asia/Kolkata"

# The mess buy/sell groups to merge. Get JIDs from `messwa groups`.
groups = [
  # "120363000000000001@g.us",
]

[dedupe]
# Posts by the same person for the same meal, mess and diet are one listing.
# This is how far back to look; it must span "tomorrow's breakfast" posted the evening before.
window = "24h"

[sold]
# Seller (or admin) reactions meaning sold. Skin tones and variation selectors are ignored.
emojis = ["✅", "✔", "☑", "👍"]
# Seller reactions meaning withdrawn.
closed_emojis = ["❌", "✖", "🚫"]
# The seller's own checkmark always counts. Set true to also count group admins' checkmarks.
admins_count = false
# Seller editing the post to include one of these, or replying to it with one, marks it sold.
words = ["sold", "done", "gone"]

[dms]
# DM content from unsaved numbers is deleted after this long.
retention = "72h"

[mcp]
listen = "127.0.0.1:8766"
# Each person makes their own MCP token on the dashboard's account page.
# On loopback, requests without a token act as the first admin, unless this
# env var holds a shared token, which then acts as the first admin instead.
token_env = "MESSWA_MCP_TOKEN"
# Default for the migrated admin to start sell tasks over MCP (start_sell_task, sell_task_status,
# cancel_sell_task). A task posts an offer in a group and messages the people
# who reply to it, from that user's linked WhatsApp account. Off by default, and every
# other MCP tool stays read-only either way.
sell_tasks = false

[dashboard]
# The listings dashboard, behind sign-in. It shows sellers' phone numbers,
# so messwa only listens on loopback or a private address such as a LAN or
# Tailscale IP.
listen = "127.0.0.1:8767"
# Optional. Beeper Desktop or Server's index.db, opened read-only. With it,
# a browser that picked Beeper in SETTINGS gets each copy of a post as a
# link to that message in Beeper Desktop.
# beeper_db = "/home/you/.beeper/profiles/server/server/index.db"

[sales]
# The sales page measures your sales against this month's bill from the mess
# portal. This fee, in rupees, is used only when the portal can't be read.
# 0 hides the bar's target then.
monthly_fee = 0

[sell]
# Group offers posted by `deliver-qr` without -peer, and by sell tasks.
# Flags of the same name (-group, -group-count, -post-gap, -show-price,
# -mention-extras, -handoff, -accept-plain-dms, -buyers,
# -accept-payment-images) override these for one deliver-qr run. Sell tasks use everything here except handoff, which
# start_sell_task sets per task; with show_price they post the task's max
# price.
#
# Which groups an offer goes to: exact names or JIDs, posted in this order...
# groups = ["Mess Buy Sell", "120363000000000002@g.us"]
# ...or the first N of the top-level `groups`. Set one of the two, not both.
# With neither, deliver-qr needs -group or -group-count.
# group_count = 2
# Pause between copies of one offer, at least 3s. The sale starts after the
# first copy; a sold or handed-off offer posts no more copies.
post_gap = "15s"
# Put the price in the group post. The payment request DM always states it.
show_price = true
# List the extras you registered for that meal in the post, read from the
# mess portal. Sell tasks always can; deliver-qr needs -portal-qr and no
# -offer-text. If the read fails, the offer goes out without them.
mention_extras = false
# When a group offer hands a buyer's chat to you. "never" runs the whole
# sale: payment request, then the QR. "on_reply" stops as soon as a buyer
# replies privately to any copy of the offer, before the bot sends them
# anything, and prints which chat to take over.
handoff = "never"
# Also treat a DM that doesn't quote the offer as a buyer, like "price?" or
# "is the kadamba lunch available". It must arrive after the first copy is
# posted, ask about this offer (name its mess, or ask the price or whether
# it's available in a short message or one naming the meal, and name no
# other mess or meal), and come from someone you haven't messaged in the
# last 30 minutes. They get the same payment request as anyone else. Off by
# default: with it on, the bot may answer people who never saw the post.
accept_plain_dms = false
# Who may buy. "anyone" sells to whoever replies privately to the offer.
# "unsaved_only" skips anyone in your address book, matched by number or
# LID: the bot logs that they replied and sends them nothing. It applies to
# deliver-qr group offers and sell tasks; a -peer delivery is your own pick.
buyers = "anyone"
# Repost the offer in a group once the last copy has dropped out of view,
# while the sale is still open. A fresh copy goes out when either trigger
# below is reached in that group, but never sooner than 5 minutes after the
# last copy and never in the meal's last 15 minutes. Time alone never
# reposts: in a quiet group the copy is still on screen.
# Replies to every copy count. The defaults come from 11 days of these
# groups at lunch and dinner, when the busiest get 9 to 14 posts every 10
# minutes. Flags of the same name override them for one deliver-qr run
# (-repost, -repost-messages, -repost-listings, -max-reposts).
repost = true
# Repost once this many messages came in after the copy, about a phone
# screen of short posts. 0 turns it off.
repost_messages = 10
# Repost once this many other sellers listed the same meal at the same mess
# after the copy. A listing tagged with a different diet doesn't count. 0
# turns it off.
repost_listings = 3
# The most fresh copies one group gets for one offer, 0 to 12. A group whose
# copy failed to send gets none.
max_reposts = 6
# Count an image from the buyer whose payment turn it is as their payment,
# for buyers who pay by UPI outside WhatsApp Pay and send a screenshot. It
# must arrive after the payment prompt and inside their pay window. Nothing
# checks what the image shows: a screenshot proves nothing, anyone can fake
# one, and the QR can't be taken back. Check your UPI app after each such
# sale; the log, sell_task_status and the sales page mark it unverified.
# Off by default. Applies to group offers, sell tasks and deliver-qr -peer.
accept_payment_images = false
# How long a negotiating sell task waits for a buyer to answer before it
# stops talking to them, 1m to 30m. A quiet buyer holds one of 10
# negotiation slots and counts as competition, which slows the price drop;
# nothing is reserved for them. A buyer who writes after this, while the
# meal is still unsold and the task active, picks up where they left off.
negotiation_silence = "10m"

# Seasons split the year for the insights page. In a term everyone is
# registered with a mess, so the market is far busier than in a break, and the
# page never averages the two together unless you pick ALL SEASONS. Dates are
# "MM-DD", both ends included, and repeat every year. Days no season covers
# count as an "Off-season" break. The defaults are below; defining any
# [[seasons]] replaces all four.
#
# [[seasons]]
# name = "Spring term"
# term = true
# starts = "01-01"
# ends = "05-07"
#
# [[seasons]]
# name = "Summer break"
# starts = "05-08"
# ends = "07-31"
#
# [[seasons]]
# name = "Monsoon term"
# term = true
# starts = "08-01"
# ends = "12-07"
#
# [[seasons]]
# name = "Winter break"
# starts = "12-08"
# ends = "12-31"

# Meal windows and mess names have built-in defaults (internal/config/config.go):
# breakfast 07:30-09:30, lunch 12:30-14:30, snacks 16:45-18:15, dinner 19:30-21:30,
# messes kadamba, yuktahar, palash, bakul. Names match with typo tolerance.
# Palash and Yuktahar are veg_only, so their listings count as veg.
# Defining any [[meals]] or [[messes]] here replaces that whole default list:
#
# [[meals]]
# name = "lunch"
# starts = "12:30"
# ends = "14:30"
# keywords = ["lunxh"]
#
# [[messes]]
# name = "palash"
# aliases = ["palas", "plsh"]
# veg_only = true
