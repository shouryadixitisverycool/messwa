services:
  messwa:
    build: .
    image: messwa:latest
    container_name: messwa
    restart: unless-stopped
    user: "1000:1000"
    # Host networking so the dashboard can bind the host address from config.toml
    # and the MCP server stays on loopback, where tokenless requests act as the first admin.
    network_mode: host
    env_file:
      - path: .env          # MESSWA_SECRET_KEY; optional MESSWA_MCP_TOKEN, MESS_API_URL and MESSWA_WA_LOG
        required: false
    volumes:
      - ./config.toml:/data/config.toml:ro
      - ./state:/data/state
