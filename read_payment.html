<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment reader</title>
<style>
:root {
  --bg: #f6f6f4; --card: #fff; --text: #1b1b1b; --muted: #6b6b6b; --line: #e2e2de;
  --accent: #2f6fdf; --ok: #1d7a46; --bad: #b3261e; --warn: #8a5a00;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121212; --card: #1d1d1d; --text: #ececec; --muted: #9a9a9a; --line: #2e2e2e;
    --accent: #7aa7ff; --ok: #6fd49a; --bad: #ff8a80; --warn: #f0c060; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 20px; margin: 0 0 4px; }
p.sub { color: var(--muted); margin: 0 0 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
input[type=text] { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
#drop { border: 2px dashed var(--line); border-radius: 12px; padding: 28px 16px; text-align: center; cursor: pointer; margin-top: 14px; color: var(--muted); }
#drop.over { border-color: var(--accent); color: var(--accent); }
#drop strong { color: var(--text); }
.result { display: grid; grid-template-columns: 160px 1fr; gap: 16px; align-items: start; }
.result img { width: 100%; border-radius: 8px; border: 1px solid var(--line); }
@media (max-width: 520px) { .result { grid-template-columns: 1fr; } .result img { max-width: 220px; } }
.amount { font-size: 28px; font-weight: 650; margin: 0 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
.ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); } .muted { color: var(--muted); }
dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 14px; }
dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
details { margin-top: 10px; font-size: 13px; }
pre { overflow-x: auto; background: var(--bg); padding: 10px; border-radius: 8px; }
a { color: var(--accent); }
.err { color: var(--bad); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Payment reader</h1>
  <p class="sub">Upload or paste a UPI payment screenshot. Gemini reads it and the page shows what the bot would see.</p>
  <div class="card">
    <label for="name">Your banking name, to check the payee</label>
    <input id="name" type="text" placeholder="As your UPI app shows it" autocomplete="off">
    <label for="upi" style="margin-top:10px">Your UPI ID</label>
    <input id="upi" type="text" placeholder="name@upi" autocomplete="off">
    <div id="drop" tabindex="0"><strong>Choose screenshots</strong> or drop or paste them here
      <input id="file" type="file" accept="image/*" multiple hidden></div>
  </div>
  <div id="results"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
fetch("config").then(r => r.json()).then(c => {
  if (c.upi && !$("#upi").value) $("#upi").value = c.upi;
  if (c.name && !$("#name").value) $("#name").value = c.name;
}).catch(() => {});

function read(file) {
  const card = document.createElement("div");
  card.className = "card";
  const url = URL.createObjectURL(file);
  card.innerHTML = `<div class="result"><img src="${url}" alt=""><div class="muted">Reading ${esc(file.name)}…</div></div>`;
  $("#results").prepend(card);
  const fd = new FormData();
  fd.append("image", file, file.name || "pasted.png");
  fd.append("upi", $("#upi").value);
  fd.append("name", $("#name").value);
  fetch("read", { method: "POST", body: fd })
    .then(r => r.json())
    .then(d => { card.querySelector(".result > div").outerHTML = d.error ? `<div class="err">${esc(d.error)}</div>` : render(d); })
    .catch(e => { card.querySelector(".result > div").outerHTML = `<div class="err">${esc(e)}</div>`; });
}

function render(d) {
  const chips = [];
  chips.push(d.is_payment_receipt ? `<span class="chip ok">receipt</span>` : `<span class="chip bad">not a receipt</span>`);
  chips.push(`<span class="chip ${d.status === "success" ? "ok" : d.status === "unknown" ? "warn" : "bad"}">${esc(d.status)}</span>`);
  if (d.payee_matches !== undefined) chips.push(d.payee_matches ? `<span class="chip ok">payee matches</span>` : `<span class="chip bad">payee doesn't match</span>`);
  if (!d.utr) chips.push(`<span class="chip warn">no UTR</span>`);
  const amt = d.amount ? `₹${esc(d.amount)}` : `<span class="warn">amount unreadable</span>`;
  const rows = [["Paid to", d.payee_name], ["Payee UPI", d.payee_upi], ["UTR", d.utr], ["Txn ID", d.transaction_id],
    ["Paid at", d.paid_at], ["Date", d.paid_date], ["App", d.app], ["Model", `${d.model} · ${d.took}`]];
  return `<div><p class="amount">${amt}</p><div class="chips">${chips.join("")}</div>
    <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v) || '<span class="muted">none</span>'}</dd>`).join("")}</dl>
    <details><summary>Raw JSON</summary><pre>${esc(JSON.stringify(d, null, 2))}</pre></details></div>`;
}

const drop = $("#drop"), input = $("#file");
const take = files => [...files].filter(f => f.type.startsWith("image/")).forEach(read);
drop.addEventListener("click", () => input.click());
drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") input.click(); });
input.addEventListener("change", () => { take(input.files); input.value = ""; });
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); take(e.dataTransfer.files); });
document.addEventListener("paste", e => take([...e.clipboardData.items].map(i => i.getAsFile()).filter(Boolean)));
</script>
</body>
</html>
