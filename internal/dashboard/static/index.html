<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d12">
<title>messwa</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="silkscreen-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="sale.css">
<link rel="stylesheet" href="sales.css">
<link rel="stylesheet" href="home.css">
<script src="common.js" defer></script>
<script src="shell.js" defer></script>
<link rel="stylesheet" href="attention.css">
<script src="attention.js" defer></script>
<script src="sell.js" defer></script>
<script src="sale.js" defer></script>
<script src="app.js" defer></script>
<script src="home.js" defer></script>
</head>
<body data-page="home">
<!-- Home (home.js): the verdict over the orb, today's meals, and a card
     per thing that needs you. app.js feeds it api/state and api/sales and
     keeps the sell sheet; attention.js hands it the attention items. -->
<main class="app home" id="home">
  <h1 class="sr-only">Home</h1>
  <section class="hero" aria-labelledby="verdict">
    <div class="orb" id="orb" data-mode="idle" aria-hidden="true">
      <i class="orb-glow"></i><i class="orb-body"></i><i class="orb-body b2"></i>
      <i class="orb-ring"></i><i class="orb-ring r2"></i><i class="orb-spark"></i>
    </div>
    <h2 class="home-verdict" id="verdict" aria-live="polite">&nbsp;</h2>
    <p class="since" id="since" hidden></p>
    <p class="sr-only" id="orbSays" role="status"></p>
  </section>

  <nav class="rail" id="rail" aria-label="Today's meals" hidden>
    <div class="rail-line" aria-hidden="true"><i></i></div>
    <div class="rail-nodes" id="railNodes"></div>
  </nav>

  <div class="sell-nudge" id="nudge" hidden></div>

  <section class="fixes" id="fixes" aria-label="Needs you" hidden></section>
</main>

<div class="tip" id="tip" hidden></div>
<div class="modal" id="modal" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" hidden></div>
</body>
</html>
