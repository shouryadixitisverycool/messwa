# Copy to config.toml. Everything except `groups` has a working default.

state_dir = "state"
timezone = "Asia/Kolkata"

# The mess buy/sell groups to merge. Get JIDs from `messwa groups`.
groups = [
  # "120363000000000001@g.us",
]

[dedupe]
# Posts by the same person for the same meal, mess and diet are one listing.
# This is how far back to look; it must span "tomorrow's breakfast" posted the evening before.
window = "24h"

[sold]
# Seller (or admin) reactions meaning sold. Skin tones and variation selectors are ignored.
emojis = ["✅", "✔", "☑", "👍"]
# Seller reactions meaning withdrawn.
closed_emojis = ["❌", "✖", "🚫"]
# The seller's own checkmark always counts. Set true to also count group admins' checkmarks.
admins_count = false
# Seller editing the post to include one of these, or replying to it with one, marks it sold.
words = ["sold", "done", "gone"]

[dms]
# DM content from unsaved numbers is deleted after this long.
retention = "72h"

[mcp]
listen = "127.0.0.1:8766"
# Each person makes their own MCP token on the dashboard's account page.
# On loopback, requests without a token act as the first admin, unless this
# env var holds a shared token, which then acts as the first admin instead.
token_env = "MESSWA_MCP_TOKEN"
# Lets admins start sell tasks over MCP (start_sell_task, sell_task_status,
# cancel_sell_task). A task posts an offer in a group and messages the people
# who reply to it, from the linked WhatsApp account. Off by default, and every
# other MCP tool stays read-only either way.
sell_tasks = false

[dashboard]
# The listings dashboard, behind sign-in. It shows sellers' phone numbers,
# so messwa only listens on loopback or a private address such as a LAN or
# Tailscale IP.
listen = "127.0.0.1:8767"
# Optional. Beeper Desktop or Server's index.db, opened read-only. With it,
# a browser that picked Beeper in SETTINGS gets each copy of a post as a
# link to that message in Beeper Desktop.
# beeper_db = "/home/you/.beeper/profiles/server/server/index.db"

[sales]
# The sales page measures your sales against this month's bill from the mess
# portal. This fee, in rupees, is used only when the portal can't be read.
# 0 hides the bar's target then.
monthly_fee = 0

[sell]
# Group offers posted by `deliver-qr` without -peer, and by sell tasks.
# Flags of the same name (-group, -group-count, -post-gap, -show-price,
# -mention-extras, -handoff, -buyers) override these for one deliver-qr run.
# Sell tasks use everything here except handoff, which start_sell_task sets
# per task; with show_price they post the task's max price.
#
# Which groups an offer goes to: exact names or JIDs, posted in this order...
# groups = ["Mess Buy Sell", "120363000000000002@g.us"]
# ...or the first N of the top-level `groups`. Set one of the two, not both.
# With neither, deliver-qr needs -group or -group-count.
# group_count = 2
# Pause between copies of one offer, at least 3s. The sale starts after the
# first copy; a sold or handed-off offer posts no more copies.
post_gap = "15s"
# Put the price in the group post. The payment request DM always states it.
show_price = true
# List the extras you registered for that meal in the post, read from the
# mess portal (needs -portal-qr). If the read fails, the offer goes out
# without them.
mention_extras = false
# When a group offer hands a buyer's chat to you. "never" runs the whole
# sale: payment request, then the QR. "on_reply" stops as soon as a buyer
# replies privately to any copy of the offer, before the bot sends them
# anything, and prints which chat to take over.
handoff = "never"
# Who may buy. "anyone" sells to whoever replies privately to the offer.
# "unsaved_only" skips anyone in your address book, matched by number or
# LID: the bot logs that they replied and sends them nothing. It applies to
# deliver-qr group offers and sell tasks; a -peer delivery is your own pick.
buyers = "anyone"

# Seasons split the year for the insights page. In a term everyone is
# registered with a mess, so the market is far busier than in a break, and the
# page never averages the two together unless you pick ALL SEASONS. Dates are
# "MM-DD", both ends included, and repeat every year. Days no season covers
# count as an "Off-season" break. The defaults are below; defining any
# [[seasons]] replaces all four.
#
# [[seasons]]
# name = "Spring term"
# term = true
# starts = "01-01"
# ends = "05-07"
#
# [[seasons]]
# name = "Summer break"
# starts = "05-08"
# ends = "07-31"
#
# [[seasons]]
# name = "Monsoon term"
# term = true
# starts = "08-01"
# ends = "12-07"
#
# [[seasons]]
# name = "Winter break"
# starts = "12-08"
# ends = "12-31"

# Meal windows and mess names have built-in defaults (internal/config/config.go):
# breakfast 07:30-09:30, lunch 12:30-14:30, snacks 16:45-18:15, dinner 19:30-21:30,
# messes kadamba, yuktahar, palash, bakul. Names match with typo tolerance.
# Palash and Yuktahar are veg_only, so their listings count as veg.
# Defining any [[meals]] or [[messes]] here replaces that whole default list:
#
# [[meals]]
# name = "lunch"
# starts = "12:30"
# ends = "14:30"
# keywords = ["lunxh"]
#
# [[messes]]
# name = "palash"
# aliases = ["palas", "plsh"]
# veg_only = true
