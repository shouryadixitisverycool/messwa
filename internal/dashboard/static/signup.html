<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d12">
<title>Sign up · Mess Auction House</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="silkscreen-700.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="account.css">
<script src="common.js" defer></script>
<script src="signup.js" defer></script>
</head>
<body>
<div class="app account login">
  <header class="top">
    <div class="brand">
      <span class="logo" id="logo"></span>
      <div>
        <h1>Mess Auction House</h1>
        <p class="sub">Make a messwa account</p>
      </div>
    </div>
  </header>

  <section class="chest" aria-label="Sign up">
    <div class="chest-head">
      <span class="head-icon" id="headIcon"></span>
      <span class="head-name">Sign up</span>
    </div>
    <form class="form" id="form" autocomplete="on">
      <label>Name<input id="name" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9._\-]{0,31}" title="Letters, digits, dots, dashes or underscores" required></label>
      <label>Password<input id="password" type="password" autocomplete="new-password" minlength="10" required></label>
      <label>Password again<input id="again" type="password" autocomplete="new-password" minlength="10" required></label>
      <p class="err" id="err" role="alert" hidden></p>
      <div class="actions"><button class="btn primary" type="submit" id="go">Create account</button></div>
      <p class="note">Next you'll connect your mess API key and ask an admin to approve you. Already have an account? <a href="login.html">Sign in</a>.</p>
    </form>
  </section>
</div>
<div class="tip" id="tip" hidden></div>
</body>
</html>
