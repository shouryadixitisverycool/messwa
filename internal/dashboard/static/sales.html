<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d12">
<title>Money · messwa</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="silkscreen-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="sales.css">
<link rel="stylesheet" href="money.css">
<script src="common.js" defer></script>
<script src="shell.js" defer></script>
<link rel="stylesheet" href="attention.css">
<script src="attention.js" defer></script>
<script src="sell.js" defer></script>
<script src="sales.js" defer></script>
<script src="ledger.js" defer></script>
<script src="recurring.js" defer></script>
<script src="money.js" defer></script>
</head>
<body data-page="money">
<div class="app sales money">
  <div class="page-head">
    <h1 class="page-title" id="title">Money</h1>
    <span class="live" id="live"><i></i><span id="liveText">connecting</span></span>
  </div>

  <p class="notice" id="notice" hidden></p>

  <div class="money-top">
    <section class="mcard jar" id="jar" aria-label="This month">
      <div class="jar-art" id="jarArt"></div>
      <div class="jar-num">
        <span class="jar-k" id="jarK"></span>
        <span class="jar-v" id="jarV"></span>
        <span class="jar-of" id="jarOf"></span>
        <div class="jar-spark" id="jarSpark" role="img"></div>
      </div>
    </section>
    <section class="mcard recap" id="recap" hidden aria-label="Weekly recap">
      <div class="recap-head">
        <span class="recap-week" id="recapWeek"></span>
        <button class="mnav" id="recapOlder" type="button" aria-label="Earlier recap">&lsaquo;</button>
        <button class="mnav" id="recapNewer" type="button" aria-label="Later recap">&rsaquo;</button>
      </div>
      <div class="recap-track" id="recapTrack"></div>
      <div class="recap-dots" id="recapDots"></div>
    </section>
  </div>

  <div class="pills" id="pills" hidden role="group" aria-label="Recurring rules and friends' meals"></div>
  <p class="sell-err" id="ruleListError" role="alert"></p>

  <section class="mcard week" aria-label="Meals by week">
    <div class="week-head">
      <button class="mnav" id="pgPrev" type="button" aria-label="Earlier recap">&lsaquo;</button>
      <span class="week-meta" id="ledMeta"></span>
      <button class="mnav" id="pgNext" type="button" aria-label="Later recap">&rsaquo;</button>
      <button class="mpill small" id="pgToday" type="button" hidden>This week</button>
      <button class="mpill small cal-multi" id="calMulti" type="button" aria-pressed="false" hidden title="Taps add meals to the pick instead of opening one">Pick several</button>
    </div>
    <div class="ledger">
      <div class="lgrid" id="lgrid" role="group" aria-label="Meals by day"></div>
      <div class="lside">
        <span class="side-k" id="sideK">This week</span>
        <div class="panel" id="insp" aria-live="polite"></div>
      </div>
    </div>
    <div class="lfilter" id="lfilter" role="group" aria-label="Show only"></div>
  </section>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet sell-sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Sell this meal"></div>
</div>
<div class="modal" id="ruleModal" hidden>
  <div class="sheet sell-sheet rule-sheet" role="dialog" aria-modal="true" aria-labelledby="ruleTitle">
    <div class="sell-head">
      <h2 id="ruleTitle">New rule</h2>
      <div class="sub" id="ruleSub"></div>
    </div>
    <form id="ruleForm" class="sell-form" novalidate>
      <fieldset class="plan-fieldset rule-fields" id="ruleFields">
        <input id="ruleID" type="hidden"><input id="ruleRevision" type="hidden">
        <input id="ruleMin" type="hidden"><input id="ruleMax" type="hidden"><input id="ruleBefore" type="hidden">
        <input id="ruleName" class="rule-name" maxlength="80" autocomplete="off" placeholder="Name, e.g. Weekday lunches" aria-label="Rule name">
        <fieldset class="rseg rule-days" id="ruleDays"><legend>Days</legend></fieldset>
        <fieldset class="rseg rule-meals" id="ruleMeals"><legend>Meals</legend></fieldset>
        <div class="rf">
          <span class="rf-k">Dates <b id="ruleSpan"></b></span>
          <div class="rule-dates">
            <input type="date" id="ruleFrom" aria-label="From">
            <span class="rd-arrow" aria-hidden="true">&rarr;</span>
            <input type="date" id="ruleThrough" aria-label="Until">
          </div>
        </div>
        <div class="rf">
          <div class="rf-top">
            <span class="rf-k">Price</span>
            <fieldset class="toggle2" id="rulePricing"><legend>Pricing</legend></fieldset>
          </div>
          <div class="rule-rel" id="ruleRelative" hidden></div>
          <div class="fr-price" id="rulePrice"></div>
        </div>
        <div class="rf rule-when">
          <div class="rf-top">
            <label class="rf-k" for="ruleBeforeRange">Goes up</label>
            <span class="rw-val"><i id="ruleClock" aria-hidden="true"></i><span id="ruleBeforeVal"></span></span>
          </div>
          <div class="rw-card">
            <div class="rw-sl">
              <span class="dim">-30m</span>
              <input type="range" min="-30" max="90" step="5" id="ruleBeforeRange" aria-label="When the offer goes up, from the meal's start">
              <span class="dim">+1h 30m</span>
            </div>
          </div>
        </div>
        <div class="rule-switches">
          <label class="rsw"><span class="rsw-t"><b>Autopilot</b><small>Skips buyers who need you</small></span><input id="ruleAuto" type="checkbox" role="switch"><i aria-hidden="true"></i></label>
          <label class="rsw"><span class="rsw-t"><b>Active</b><small>Keeps scheduling new meals</small></span><input id="ruleEnabled" type="checkbox" role="switch"><i aria-hidden="true"></i></label>
          <label class="rsw" id="ruleApplyRow" hidden><span class="rsw-t"><b>Update <span id="ruleWaitingCount">0</span> waiting</b><small>Meals you edited by hand keep theirs</small></span><input id="ruleApply" type="checkbox" role="switch"><i aria-hidden="true"></i></label>
        </div>
      </fieldset>
      <div class="rule-preview" id="rulePreviewBox" hidden>
        <div class="sell-sum" id="rulePreviewSum" hidden></div>
        <p class="sell-note" id="rulePreviewText" role="status"></p>
      </div>
      <div class="rule-delete" id="ruleDeleteBox" hidden>
        <p class="sell-note">Meals already selling carry on. Removed ones stay out of rules until you allow them from the week grid.</p>
        <label class="rsw"><span class="rsw-t"><b>Remove its waiting meals</b></span><input id="ruleRemoveWaiting" type="checkbox" role="switch"><i aria-hidden="true"></i></label>
        <div class="sell-acts"><button type="button" class="sell-btn" id="ruleDeleteBack">BACK</button><button type="button" class="sell-btn red" id="ruleDelete">DELETE RULE</button></div>
      </div>
      <p class="sell-err" id="ruleError" role="alert"></p>
      <div class="sell-acts" id="ruleActs">
        <button type="button" class="sell-btn red rule-del" id="ruleDeleteAsk" hidden>DELETE</button>
        <button type="button" class="sell-btn" id="ruleCancel">CANCEL</button>
        <button type="button" class="sell-btn gold" id="rulePreview">PREVIEW</button>
        <button type="submit" class="sell-btn gold" id="ruleSave" disabled hidden>SAVE RULE</button>
      </div>
    </form>
  </div>
</div>
<div class="tip" id="tip" hidden></div>
</body>
</html>
