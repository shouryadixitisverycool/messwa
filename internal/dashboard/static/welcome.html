<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d12">
<title>Welcome · Mess Auction House</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="silkscreen-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="account.css">
<link rel="stylesheet" href="welcome.css">
<script src="common.js" defer></script>
<script src="welcome-plan.js" defer></script>
<script src="welcome.js" defer></script>
</head>
<body class="welcome">
<div class="chat">
  <header class="chat-top">
    <span class="bot-av" id="logo" aria-hidden="true"></span>
    <div class="chat-who">
      <h1>messwa</h1>
      <p class="chat-state" id="state">online</p>
    </div>
    <button class="nav-link" id="logout" type="button">Sign out</button>
    <div class="chat-progress" aria-hidden="true"><span id="progress"></span></div>
  </header>

  <main class="chat-main"><div class="chat-log" id="log" role="log" aria-label="Setup chat"></div></main>

  <footer class="composer" id="composer">
    <div class="chips" id="chips" role="group" aria-label="Replies"></div>
    <form class="say" id="say" hidden>
      <button class="say-pick" type="button" id="pick" title="Read it from a UPI QR" aria-label="Read UPI ID from a QR image" hidden></button>
      <input id="sayInput" autocomplete="off" spellcheck="false" aria-label="Your reply">
      <button class="say-send" type="submit" id="send" aria-label="Send"></button>
    </form>
    <input type="file" id="upiFile" accept="image/png,image/jpeg" hidden>
  </footer>
</div>
<div class="tip" id="tip" hidden></div>
</body>
</html>
